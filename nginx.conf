# Configuracion de Nginx para servir Flutter Web como Single Page Application
# Va dentro de la carpeta /frontend, junto al Dockerfile.frontend

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Si la ruta pedida no existe como archivo, Nginx devuelve
        # index.html para que el router interno de Flutter la resuelva.
        try_files $uri $uri/ /index.html;
    }

    # Cache mas largo para los assets estaticos generados por Flutter
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
