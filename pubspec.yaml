name: aldia
description: AlDía – Sistema de Gestión y Notificación de Pagos de Arriendo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # HTTP cliente para API Spring Boot
  http: ^1.2.0
  # Almacenamiento seguro JWT
  flutter_secure_storage: ^9.0.0
  # Manejo de estado (próxima fase)
  provider: ^6.1.1
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

 
